<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>TIX3 Live Tour 2026 — Bức Tường</title>
    <meta name="description" content="Bức Tường — TIX3 Live Tour 2026. Hà Nội 12/12, TP. HCM 26/12. One wall, many worlds." />
    <meta name="theme-color" content="#E8E8ED" />
    <meta property="og:title" content="TIX3 Live Tour 2026 — Bức Tường" />
    <meta property="og:description" content="Hà Nội 12/12 · TP. HCM 26/12" />
    <meta property="og:image" content="images/poster-og.jpg" />
    <link rel="preload" as="image" imagesrcset="images/poster-800.webp 800w, images/poster-1200.webp 1200w, images/poster-1800.webp 1800w" imagesizes="(min-aspect-ratio: 9/14) calc(100svh * 1800 / 2800), 100vw" fetchpriority="high" />
    <style>
      html, body { margin: 0; height: 100%; }
      body {
        min-height: 100svh;
        display: grid; place-items: center;
        background: linear-gradient(#ffffff, #dcdce1);
      }
      .poster { display: block; width: 100%; height: auto; }
      /* Màn hình rộng hơn tỉ lệ poster (9:14): poster cao vừa màn hình, canh giữa */
      .sound {
        position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 2;
        display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px;
        border: 0; border-radius: 999px; cursor: pointer;
        font: 500 14px/1 system-ui, -apple-system, "Segoe UI", sans-serif; color: #fff;
        background: rgba(20, 20, 28, 0.72); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
      }
      .sound:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
      .sound svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; }
      .sound .off { display: none; }
      .sound[aria-pressed="false"] .on { display: none; }
      .sound[aria-pressed="false"] .off { display: inline; }
      /* Màn chào "bức tường": đĩa CD quay; chạm → đĩa quay nhanh, nứt dọc giữa → tường tách đôi, nhạc bật
         (trình duyệt không cho tự phát nhạc có tiếng nên cần 1 lần chạm) */
      :root { --ink: #231F20; --paper: 242, 242, 244; --ease-wall: cubic-bezier(0.7, 0, 0.2, 1); }
      .gate {
        position: fixed; inset: 0; z-index: 3; display: grid; place-items: center;
        padding: 24px; border: 0; background: none; cursor: pointer; color: var(--ink);
        -webkit-tap-highlight-color: transparent;
      }
      /* Lớp mờ liền khối khi chờ; lúc mở mới đổi sang 2 nửa trượt ra (tránh đường nối giữa 2 nửa) */
      .gate__veil, .gate__half {
        position: absolute; top: 0; bottom: 0;
        background: rgba(var(--paper), 0.5);
        -webkit-backdrop-filter: blur(7px) saturate(0.85); backdrop-filter: blur(7px) saturate(0.85);
      }
      .gate__veil { left: 0; right: 0; }
      .gate.is-open .gate__veil { visibility: hidden; }
      .gate__half { visibility: hidden; }
      .gate.is-open .gate__half { visibility: visible; }
      .gate__half {
        position: absolute; top: 0; bottom: 0; width: 50%;
        background: rgba(var(--paper), 0.5);
        -webkit-backdrop-filter: blur(7px) saturate(0.85); backdrop-filter: blur(7px) saturate(0.85);
        transition: transform 1000ms var(--ease-wall) 420ms;
      }
      .gate__half--l { left: 0; }
      .gate__half--r { right: 0; }
      /* Vết nứt: mang màu sơn của poster */
      .gate__crack {
        position: absolute; left: 50%; top: 0; bottom: 0; width: 3px; translate: -50% 0;
        background: linear-gradient(#1F5E7A, #B3262E 35%, #E3A13B 65%, #1F5E7A);
        transform: scaleY(0); transform-origin: 50% 0;
        transition: transform 240ms ease-in 200ms, opacity 300ms ease 1100ms;
      }
      .gate__mark { position: relative; display: grid; justify-items: center; gap: 26px; transition: transform 600ms var(--ease-wall) 250ms, opacity 400ms ease 300ms; }
      /* Đĩa CD TIX3 đang quay (images/icon.jpg) — đang phát "Trên Đỉnh Gió" */
      .disc {
        --d: min(72vw, 380px);
        position: relative; width: var(--d); aspect-ratio: 1; border-radius: 50%;
        filter: drop-shadow(0 22px 40px rgba(20, 20, 28, 0.32)) drop-shadow(0 2px 4px rgba(20, 20, 28, 0.25));
        animation: disc-in 900ms var(--ease-wall) both;
        transition: transform 180ms ease;
      }
      .disc__cd {
        display: block; width: 100%; height: 100%; border-radius: 50%;
        /* bỏ nền trắng ở góc và lỗ giữa đĩa */
        -webkit-mask: radial-gradient(circle closest-side, transparent 0 9.2%, #000 9.8% 98.6%, transparent 99.4%);
                mask: radial-gradient(circle closest-side, transparent 0 9.2%, #000 9.8% 98.6%, transparent 99.4%);
        animation: spin 5s linear infinite;
      }
      /* Ánh sáng loang trên mặt đĩa: đứng yên trong khi đĩa quay */
      .disc__sheen {
        position: absolute; inset: 0; border-radius: 50%; pointer-events: none; mix-blend-mode: soft-light;
        background: conic-gradient(from 20deg, transparent 0 6%, rgba(255,255,255,0.55) 11%, transparent 17% 52%, rgba(255,255,255,0.4) 61%, transparent 67%);
        -webkit-mask: radial-gradient(circle closest-side, transparent 0 9.8%, #000 10.4% 98.6%, transparent 99.4%);
                mask: radial-gradient(circle closest-side, transparent 0 9.8%, #000 10.4% 98.6%, transparent 99.4%);
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes disc-in { from { transform: translateY(24px) scale(0.92); opacity: 0; } }
      .gate:hover .disc { transform: translateY(-2px); }
      .gate:active .disc { transform: scale(0.97); }
      .gate:focus-visible .disc { outline: 2px solid var(--ink); outline-offset: 8px; }
      .gate.is-open .disc__cd { animation-duration: 0.5s; }
      .gate__cta {
        font: 500 15px/1 system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: 0.04em;
        opacity: 0; animation: cta 600ms ease 0.7s forwards, breathe 2.4s ease-in-out 1.3s infinite;
      }
      @keyframes cta { to { opacity: 1; } }
      @keyframes breathe { 50% { opacity: 0.45; } }
      .gate:focus-visible { outline: none; }
      /* Mở tường */
      .gate.is-open { pointer-events: none; }
      .gate.is-open .gate__crack { transform: scaleY(1); opacity: 0; }
      .gate.is-open .gate__half--l { transform: translateX(-101%); }
      .gate.is-open .gate__half--r { transform: translateX(101%); }
      .gate.is-open .gate__mark { transform: scale(1.06); opacity: 0; }
      .gate.is-gone { display: none; }
      @media (prefers-reduced-motion: reduce) {
        .disc, .disc__cd { animation: none; }
        .gate__cta { animation: none; opacity: 1; }
        .gate__half, .gate__crack, .gate__mark { transition: opacity 300ms ease; }
        .gate.is-open .gate__half--l, .gate.is-open .gate__half--r { transform: none; opacity: 0; }
      }
      @media (min-aspect-ratio: 9/14) {
        .poster { width: auto; height: 100vh; height: 100svh; box-shadow: 0 0 60px rgba(20, 20, 30, 0.12); }
      }
    </style>
  </head>
  <body>
    <h1 hidden>TIX3 Live Tour 2026 — Bức Tường</h1>
    <img
      class="poster"
      src="images/poster-1200.webp"
      srcset="images/poster-800.webp 800w, images/poster-1200.webp 1200w, images/poster-1800.webp 1800w"
      sizes="(min-aspect-ratio: 9/14) calc(100svh * 1800 / 2800), 100vw"
      width="1800" height="2800"
      alt="Poster TIX3 Live Tour 2026 của ban nhạc Bức Tường: Hà Nội 12/12, TP. HCM 26/12 — One wall, many worlds"
      fetchpriority="high"
      decoding="async"
    />
    <button class="gate" id="enter" type="button" aria-label="Chạm để vào trang và bật nhạc">
      <span class="gate__veil" aria-hidden="true"></span>
      <span class="gate__half gate__half--l" aria-hidden="true"></span>
      <span class="gate__half gate__half--r" aria-hidden="true"></span>
      <span class="gate__crack" aria-hidden="true"></span>
      <span class="gate__mark">
        <span class="disc">
          <img class="disc__cd" src="images/icon-800.webp" srcset="images/icon-400.webp 400w, images/icon-800.webp 800w" sizes="min(72vw, 380px)" width="800" height="800" alt="" />
          <span class="disc__sheen"></span>
        </span>
        <span class="gate__cta">Chạm để vào</span>
      </span>
    </button>
    <!-- Nhạc nền: Trên Đỉnh Gió — Trần Tuấn Hùng (3:40 → hết), tự phát khi vào trang -->
    <audio id="bgm" src="audio/tren-dinh-gio.m4a" preload="auto" autoplay loop></audio>
    <button class="sound" id="sound" type="button" aria-pressed="true" aria-label="Bật/tắt nhạc">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="on" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="off" d="M17 9l5 6M22 9l-5 6"/></svg>
      <span class="on">Tắt nhạc</span><span class="off">Bật nhạc</span>
    </button>
    <script>
      (() => {
        const a = document.getElementById('bgm'), b = document.getElementById('sound'), gate = document.getElementById('enter');
        a.volume = 0.7;
        const show = () => b.setAttribute('aria-pressed', String(!a.paused));
        a.addEventListener('play', show); a.addEventListener('pause', show);
        const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
        const enter = () => {
          if (gate.classList.contains('is-open')) return;
          a.play().catch(() => {});
          gate.classList.add('is-open');
          setTimeout(() => gate.classList.add('is-gone'), reduce ? 350 : 1550);
        };
        // Nếu trình duyệt cho tự phát (ít gặp) thì bỏ qua màn chào; không thì chờ khách chạm
        a.play().then(() => gate.classList.add('is-gone')).catch(() => {});
        gate.addEventListener('click', enter);
        show();
        b.addEventListener('click', () => { a.paused ? a.play().catch(() => {}) : a.pause(); });
        try { localStorage.removeItem('tix3-muted'); } catch (e) {}
      })();
    </script>
  </body>
</html>
