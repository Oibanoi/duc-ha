    <style>
      html, body { margin: 0; height: 100%; }
      body {
        min-height: 100svh;
        display: grid; place-items: center;
        background: linear-gradient(#ffffff, #dcdce1);
      }
      .poster { display: block; width: 100%; height: auto; }
      /* Màn hình rộng hơn tỉ lệ poster (9:14): poster cao vừa màn hình, canh giữa */
      .sound {
        position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 2;
        display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px;
        border: 0; border-radius: 999px; cursor: pointer;
        font: 500 14px/1 system-ui, -apple-system, "Segoe UI", sans-serif; color: #fff;
        background: rgba(20, 20, 28, 0.72); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
      }
      .sound:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
      .sound svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; }
      .sound .off { display: none; }
      .sound[aria-pressed="false"] .on { display: none; }
      .sound[aria-pressed="false"] .off { display: inline; }
      /* Màn chào "bức tường": logo tự vẽ nét; chạm → nứt dọc giữa → tường tách đôi, nhạc bật
         (trình duyệt không cho tự phát nhạc có tiếng nên cần 1 lần chạm) */
      :root { --ink: #231F20; --paper: 242, 242, 244; --ease-wall: cubic-bezier(0.7, 0, 0.2, 1); }
      .gate {
        position: fixed; inset: 0; z-index: 3; display: grid; place-items: center;
        padding: 24px; border: 0; background: none; cursor: pointer; color: var(--ink);
        -webkit-tap-highlight-color: transparent;
      }
      /* Lớp mờ liền khối khi chờ; lúc mở mới đổi sang 2 nửa trượt ra (tránh đường nối giữa 2 nửa) */
      .gate__veil, .gate__half {
        position: absolute; top: 0; bottom: 0;
        background: rgba(var(--paper), 0.5);
        -webkit-backdrop-filter: blur(7px) saturate(0.85); backdrop-filter: blur(7px) saturate(0.85);
      }
      .gate__veil { left: 0; right: 0; }
      .gate.is-open .gate__veil { visibility: hidden; }
      .gate__half { visibility: hidden; }
      .gate.is-open .gate__half { visibility: visible; }
      .gate__half {
        position: absolute; top: 0; bottom: 0; width: 50%;
        background: rgba(var(--paper), 0.5);
        -webkit-backdrop-filter: blur(7px) saturate(0.85); backdrop-filter: blur(7px) saturate(0.85);
        transition: transform 1000ms var(--ease-wall) 220ms;
      }
      .gate__half--l { left: 0; }
      .gate__half--r { right: 0; }
      /* Vết nứt: mang màu sơn của poster */
      .gate__crack {
        position: absolute; left: 50%; top: 0; bottom: 0; width: 3px; translate: -50% 0;
        background: linear-gradient(#1F5E7A, #B3262E 35%, #E3A13B 65%, #1F5E7A);
        transform: scaleY(0); transform-origin: 50% 0;
        transition: transform 240ms ease-in, opacity 300ms ease 900ms;
      }
      .gate__mark { position: relative; display: grid; justify-items: center; gap: 22px; transition: transform 500ms var(--ease-wall), opacity 350ms ease; }
      .logo { width: min(78vw, 560px); height: auto; overflow: visible; filter: drop-shadow(0 2px 14px rgba(var(--paper), 0.9)); }
      .logo path {
        fill: var(--ink); fill-opacity: 0;
        stroke: var(--ink); stroke-width: 1.4; stroke-dasharray: 1; stroke-dashoffset: 1;
        animation: draw 1.8s var(--ease-wall) forwards, ink 900ms ease 1.3s forwards;
      }
      .logo path:nth-child(odd) { animation-delay: 0.12s, 1.4s; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes ink { to { fill-opacity: 1; stroke-width: 0; } }
      .gate__cta {
        font: 500 15px/1 system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: 0.04em;
        opacity: 0; animation: cta 600ms ease 2s forwards, breathe 2.4s ease-in-out 2.6s infinite;
      }
      @keyframes cta { to { opacity: 1; } }
      @keyframes breathe { 50% { opacity: 0.45; } }
      .gate:hover .gate__mark { transform: scale(1.02); }
      .gate:focus-visible { outline: none; }
      .gate:focus-visible .logo { outline: 2px solid var(--ink); outline-offset: 12px; }
      /* Mở tường */
      .gate.is-open { pointer-events: none; }
      .gate.is-open .gate__crack { transform: scaleY(1); opacity: 0; }
      .gate.is-open .gate__half--l { transform: translateX(-101%); }
      .gate.is-open .gate__half--r { transform: translateX(101%); }
      .gate.is-open .gate__mark { transform: scale(1.06); opacity: 0; }
      .gate.is-gone { display: none; }
      @media (prefers-reduced-motion: reduce) {
        .logo path { animation: none; fill-opacity: 1; stroke-width: 0; }
        .gate__cta { animation: none; opacity: 1; }
        .gate__half, .gate__crack, .gate__mark { transition: opacity 300ms ease; }
        .gate.is-open .gate__half--l, .gate.is-open .gate__half--r { transform: none; opacity: 0; }
      }
      @media (min-aspect-ratio: 9/14) {
        .poster { width: auto; height: 100vh; height: 100svh; box-shadow: 0 0 60px rgba(20, 20, 30, 0.12); }
      }
    </style>

    <!-- Nhạc nền: Vòng Xoay — Bức Tường (3:09 → hết), tự phát khi vào trang -->
    <audio id="bgm" src="audio/vong-xoay.m4a" preload="auto" autoplay loop></audio>
    <button class="sound" id="sound" type="button" aria-pressed="true" aria-label="Bật/tắt nhạc">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="on" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="off" d="M17 9l5 6M22 9l-5 6"/></svg>
      <span class="on">Tắt nhạc</span><span class="off">Bật nhạc</span>
    </button>
    <script>
      (() => {
        const a = document.getElementById('bgm'), b = document.getElementById('sound'), gate = document.getElementById('enter');
        a.volume = 0.7;
        const show = () => b.setAttribute('aria-pressed', String(!a.paused));
        a.addEventListener('play', show); a.addEventListener('pause', show);
        const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
        const enter = () => {
          if (gate.classList.contains('is-open')) return;
          a.play().catch(() => {});
          gate.classList.add('is-open');
          setTimeout(() => gate.classList.add('is-gone'), reduce ? 350 : 1300);
        };
        // Nếu trình duyệt cho tự phát (ít gặp) thì bỏ qua màn chào; không thì chờ khách chạm
        a.play().then(() => gate.classList.add('is-gone')).catch(() => {});
        gate.addEventListener('click', enter);
        show();
        b.addEventListener('click', () => { a.paused ? a.play().catch(() => {}) : a.pause(); });
        try { localStorage.removeItem('tix3-muted'); } catch (e) {}
      })();
    </script>
  </body>
</html>
