<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>TIX3 Live Tour 2026 — Bức Tường</title>
    <meta name="description" content="Bức Tường — TIX3 Live Tour 2026. Hà Nội 12/12, TP. HCM 26/12. One wall, many worlds." />
    <meta name="theme-color" content="#E8E8ED" />
    <meta property="og:title" content="TIX3 Live Tour 2026 — Bức Tường" />
    <meta property="og:description" content="Hà Nội 12/12 · TP. HCM 26/12" />
    <meta property="og:image" content="images/poster-og.jpg" />
    <link rel="preload" as="image" imagesrcset="images/poster-800.webp 800w, images/poster-1200.webp 1200w, images/poster-1800.webp 1800w" imagesizes="(min-aspect-ratio: 9/14) calc(100svh * 1800 / 2800), 100vw" fetchpriority="high" />
    <style>
      html, body { margin: 0; height: 100%; }
      body {
        min-height: 100svh;
        display: grid; place-items: center;
        background: linear-gradient(#ffffff, #dcdce1);
      }
      .poster { display: block; width: 100%; height: auto; }
      /* Màn hình rộng hơn tỉ lệ poster (9:14): poster cao vừa màn hình, canh giữa */
      @media (min-aspect-ratio: 9/14) {
        .poster { width: auto; height: 100vh; height: 100svh; box-shadow: 0 0 60px rgba(20, 20, 30, 0.12); }
      }
    </style>
  </head>
  <body>
    <h1 hidden>TIX3 Live Tour 2026 — Bức Tường</h1>
    <img
      class="poster"
      src="images/poster-1200.webp"
      srcset="images/poster-800.webp 800w, images/poster-1200.webp 1200w, images/poster-1800.webp 1800w"
      sizes="(min-aspect-ratio: 9/14) calc(100svh * 1800 / 2800), 100vw"
      width="1800" height="2800"
      alt="Poster TIX3 Live Tour 2026 của ban nhạc Bức Tường: Hà Nội 12/12, TP. HCM 26/12 — One wall, many worlds"
      fetchpriority="high"
      decoding="async"
    />
  </body>
</html>
